[project]
name = "voice-service"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.40",
    "google-genai>=2.18.1",
    "langsmith>=0.11.1",
    "livekit-agents[google]>=1.6.8",
    "pydantic-settings>=2",
    "redis>=8.1.0",
    "sentry-sdk>=2.67.1",
    "voice-contract",
    "websockets>=14.0,<17.0",
]

[project.scripts]
voice-service = "voice_service:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mock-agent-backend",
    "pytest>=9.1.1",
]

[tool.uv.sources]
voice-contract = { path = "../../libs/voice-contract", editable = true }
mock-agent-backend = { path = "../mock-agent-backend", editable = true }
